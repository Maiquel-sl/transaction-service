spring:
  application:
    name: transaction-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/transaction-service-db}
  cloud:
    function:
      definition: accountEventConsumer;creditEventConsumer
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        accountEventConsumer-in-0:
          destination: bank-account-events
          group: transaction-audit-group
          content-type: application/json
        creditEventConsumer-in-0:
          destination: bank-credit-events
          group: transaction-audit-group
          content-type: application/json

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /transaction-openapi.yml
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8084}