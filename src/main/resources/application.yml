spring:
  application:
    name: transaction-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/transaction-service-db}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /transaction-openapi.yml
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8084}